<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Visionary Ads Studio{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --brand-500: #4f46e5;
    --brand-600: #4338ca;
    --brand-700: #3730a3;
    --accent-500: #ec4899;
    --primary-blue: #3b82f6;
    --surface: #ffffff;
    --surface-muted: #f3f6fb;
    --border: #e5e7eb;
    --text-primary: #111827;
    --text-secondary: #475569;
    --success-500: #16a34a;
    --error-500: #dc2626;
    --warning-500: #d97706;
    --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-md: 0 12px 34px rgba(15, 23, 42, 0.12);
    --transition: 200ms ease;
    --sidebar-width: 260px;
}

/* Reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; font-family: 'Inter', sans-serif; line-height: 1.55; }
body { background: #f3f6fb; color: var(--text-primary); }

/* Links */
a { text-decoration: none; color: var(--primary-blue); transition: color var(--transition); }
a:hover, a:focus-visible { color: var(--brand-700); outline: none; }

/* Layout */
.page-shell { display: flex; min-height: 100vh; }

/* Sidebar */
aside.sidebar {
    width: var(--sidebar-width);
    background: var(--surface);
    border-right: 1px solid rgba(15,23,42,0.08);
    display: flex; flex-direction: column; padding: 2rem 1.5rem;
    box-shadow: var(--shadow-sm);
    transition: left 0.3s ease;
}
.sidebar .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
.sidebar .brand-badge {
    width: 50px; height: 50px; border-radius: 14px;
    background: linear-gradient(135deg,#935BF5 );
    display: grid; place-items: center; font-weight: 700; color: #ffffff; font-size: 1.1rem;
}
.sidebar .brand-text span:first-child { font-size: 1.1rem; font-weight: 600; color: #935BF5; }
.sidebar .brand-text span:last-child { font-size: 0.78rem; font-weight: 500; color: #935BF5); text-transform: uppercase; letter-spacing: 0.1em; }

.sidebar nav { display: flex; flex-direction: column; gap: 0.5rem; }
.sidebar nav a {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem;
    font-weight: 500; border-radius: 12px; transition: background #935BF5, color #935BF5;
    position: relative;
}
.sidebar nav a.active::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: #935BF5; border-radius: 0 4px 4px 0;
}
.sidebar nav a:hover, .sidebar nav a:focus-visible { background: rgba(59,130,246,0.12); color: #935BF5; }

/* Main content */
main.main-content { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }

/* Topbar */
header.topbar {
    background: #935BF5;
    color: #ffffff;
    border-bottom: 1px solid rgba(15,23,42,0.08);
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem; box-shadow: var(--shadow-sm);
    position: sticky; top: 0; z-index: 1000;
}
header.topbar .topbar-left { font-weight: 600; font-size: 1.2rem; }
header.topbar .topbar-right { display: flex; align-items: center; gap: 1rem; position: relative; }
header.topbar .account-logo {
    width: 40px; height: 40px; border-radius: 50%; background:#935BF5;border:1px solid #313034ff;
    display: grid; place-items: center;
    color: #496ed5ff; font-weight: 700; cursor: pointer;
}

/* Account dropdown */
.account-dropdown {
    position: absolute;
    top: 50px; right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-md);
    width: 180px;
    display: none;
    flex-direction: column;
    z-index: 2000;
}
.account-dropdown a {
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    color: var(--text-primary);
}
.account-dropdown a:hover {
    background: var(--surface-muted);
}

/* Content */
main.content-area { padding: 2.5rem 2rem; }

/* Page header */
.page-header { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
.page-header h1 { font-size: clamp(2rem, 2.6vw + 1rem, 2.8rem); font-weight: 600; color: var(--brand-600); }
.page-header p { font-size: 1.05rem; color: var(--text-secondary); max-width: 680px; }

/* Cards */
.card {
    background: var(--surface); border-radius: 18px; padding: 2rem;
    border: 1px solid rgba(15,23,42,0.05); box-shadow: var(--shadow-md);
    transition: transform var(--transition), box-shadow var(--transition);
}
.card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
.card--accent { background: var(--primary-blue); color: #fff; }
.card--accent p { color: rgba(255,255,255,0.88); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.4rem; border-radius: 12px; font-weight: 600; font-size: 0.96rem; border: none; cursor: pointer; transition: all var(--transition); }
.btn--primary { background: var(--primary-blue); color: #fff; box-shadow: 0 12px 26px rgba(59,130,246,0.22); }
.btn--primary:hover { filter: brightness(0.95); box-shadow: 0 16px 34px rgba(59,130,246,0.28); }
.btn--ghost { background: rgba(59,130,246,0.12); color: var(--primary-blue); }
.btn--ghost:hover { background: rgba(59,130,246,0.2); }

/* Footer */
footer { padding: 2rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid rgba(15,23,42,0.08); }

/* Responsive */
@media(max-width: 1024px){
    aside.sidebar { position: fixed; left: -260px; top: 0; height: 100%; z-index: 999; }
    aside.sidebar.active { left: 0; }
    main.main-content { margin-left: 0; }
}
@media(max-width: 768px){
    header.topbar { padding: 1rem 1.5rem; flex-direction: row; justify-content: space-between; }
    main.content-area { padding: 2rem 1rem; }
    .sidebar { padding: 1.5rem 1rem; }
}
</style>
</head>
<body>
<div class="page-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-badge">AI</div>
            <div class="brand-text">
                <span>Automatter</span>
            </div>
        </div>
        <nav>
            {% block nav %}
            <a href="/" class="active" style="color:#935BF5">Dashboard</a>
            <a href="/simple" style="color:#935BF5" >Generate Ad</a>
            <a href="/download-sample-excel" style="color:#935BF5">Sample Template</a>
            {% endblock %}
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left" style="color:white" >Social Media Scheduler</div>
            <div class="topbar-right">
                <div class="account-logo" id="accountIcon" style="color:white">A</div>
                <div class="account-dropdown" id="accountDropdown">
                    <a href="/profile">👤 Profile</a>
                    <a href="/settings">⚙️ Settings</a>
                    <a href="/logout">🚪 Logout</a>
                </div>
            </div>
        </header>

        <div class="content-area">
            {% block content %}{% endblock %}
        </div>

        <footer>
            Built for automated Instagram advertising workflows. &copy; {{ current_year | default('2025') }} Visionary Ads Studio.
        </footer>
    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const accountIcon = document.getElementById("accountIcon");
    const dropdown = document.getElementById("accountDropdown");

    accountIcon.addEventListener("click", () => {
        dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    // Close when clicking outside
    document.addEventListener("click", (e) => {
        if (!accountIcon.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = "none";
        }
    });
});
</script>
</body>
</html>
