<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Visionary Ads Studio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-500: #4f46e5;
            --brand-600: #4338ca;
            --brand-700: #3730a3;
            --accent-500: #ec4899;
            --surface: #ffffff;
            --surface-muted: #f5f5ff;
            --border: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #475569;
            --success-500: #16a34a;
            --error-500: #dc2626;
            --warning-500: #d97706;
            --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.08);
            --transition: 200ms ease;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            line-height: 1.55;
        }

        a {
            color: var(--brand-600);
            text-decoration: none;
            transition: color var(--transition);
        }

        a:hover,
        a:focus-visible {
            color: var(--brand-700);
            outline: none;
        }

        .page-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(79, 70, 229, 0.08);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(79, 70, 229, 0.15);
        }

        .top-bar {
            width: min(1120px, 100% - 3rem);
            margin: 0 auto;
            padding: 1.25rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .brand-badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-500));
            display: grid;
            place-items: center;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .brand-text span:first-child {
            font-size: 1.08rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand-text span:last-child {
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-secondary);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        nav a {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.45rem 0.95rem;
            border-radius: 999px;
        }

        nav a:hover,
        nav a:focus-visible {
            background: rgba(79, 70, 229, 0.12);
        }

        main {
            flex: 1;
            width: min(1120px, 100% - 3rem);
            margin: 0 auto;
            padding: 3rem 0 4rem;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-size: clamp(2rem, 2.6vw + 1rem, 2.8rem);
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .page-header p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 680px;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(15, 23, 42, 0.04);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .card + .card {
            margin-top: 1.5rem;
        }

        .card--accent {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.94), rgba(236, 72, 153, 0.92));
            color: #ffffff;
        }

        .card--accent p {
            color: rgba(255, 255, 255, 0.88);
        }

        .grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.4rem;
            border-radius: 12px;
            border: 1px solid transparent;
            font-weight: 600;
            font-size: 0.96rem;
            line-height: 1.2;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn--primary {
            background: linear-gradient(135deg, var(--brand-500), var(--accent-500));
            color: #ffffff;
            box-shadow: 0 12px 26px rgba(79, 70, 229, 0.22);
        }

        .btn--primary:hover {
            filter: brightness(0.96);
            box-shadow: 0 16px 34px rgba(79, 70, 229, 0.28);
        }

        .btn--ghost {
            background: rgba(79, 70, 229, 0.12);
            color: var(--brand-600);
        }

        .btn--ghost:hover {
            background: rgba(79, 70, 229, 0.18);
        }

        .btn--neutral {
            background: #ffffff;
            color: var(--text-primary);
            border-color: var(--border);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.42rem 0.85rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .badge--brand {
            background: rgba(79, 70, 229, 0.15);
            color: var(--brand-600);
        }

        .alert {
            padding: 1.1rem 1.35rem;
            border-radius: 18px;
            border: 1px solid transparent;
            font-size: 0.96rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .alert strong {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .alert--info {
            background: rgba(59, 130, 246, 0.12);
            border-color: rgba(59, 130, 246, 0.32);
            color: #2563eb;
        }

        .alert--success {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.32);
            color: var(--success-500);
        }

        .alert--error {
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.28);
            color: var(--error-500);
        }

        form .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.35rem;
        }

        label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="url"],
        input[type="file"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(15, 23, 42, 0.1);
            background: rgba(255, 255, 255, 0.94);
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            transition: border var(--transition), box-shadow var(--transition);
        }

        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: none;
            border-color: rgba(79, 70, 229, 0.65);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        small {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        table thead {
            background: var(--surface-muted);
        }

        table th,
        table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        table tbody tr:hover {
            background: rgba(79, 70, 229, 0.06);
        }

        code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: rgba(15, 23, 42, 0.06);
            border-radius: 6px;
            padding: 0.2rem 0.45rem;
            font-size: 0.85rem;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .modal.is-visible {
            display: flex;
        }

        .modal__dialog {
            background: var(--surface);
            border-radius: 24px;
            padding: 2rem;
            width: min(540px, 100%);
            box-shadow: 0 28px 55px rgba(15, 23, 42, 0.22);
            position: relative;
        }

        .modal__close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: rgba(15, 23, 42, 0.06);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        footer {
            padding: 2.5rem 0 3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem 0;
                width: min(100% - 2rem, 100%);
            }

            nav {
                width: 100%;
                gap: 0.5rem;
            }

            nav a {
                padding: 0.4rem 0.75rem;
            }

            main {
                width: min(100% - 2rem, 100%);
                padding: 2rem 0 3rem;
            }

            header {
                border-radius: 0 0 24px 24px;
            }

            .card {
                padding: 1.5rem;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header>
            <div class="top-bar">
                <div class="brand">
                    <div class="brand-badge">AI</div>
                    <div class="brand-text">
                        <span>Visionary Ads Studio</span>
                        <span>Automation Platform</span>
                    </div>
                </div>
                <nav>
                    {% block nav %}
                    <a href="/">Dashboard</a>
                    <a href="/simple">Generate Ad</a>
                    <a href="/download-sample-excel">Sample Template</a>
                    {% endblock %}
                </nav>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            Built for automated Instagram advertising workflows. &copy; {{ current_year | default('2025') }} Visionary Ads Studio.
        </footer>
    </div>
</body>
</html>
