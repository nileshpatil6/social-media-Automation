<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Automatter</title>
    <link rel="stylesheet" href="/static/premium-design.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-6);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
        }

        @keyframes backgroundMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: var(--space-10);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2), 0 10px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .auth-brand {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .auth-brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: var(--primary-gradient);
            border-radius: 16px;
            margin-bottom: var(--space-4);
            box-shadow: 0 10px 30px rgba(103, 126, 234, 0.3);
        }

        .auth-brand-logo svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .auth-brand-name {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .auth-brand-tagline {
            font-size: var(--font-base);
            color: var(--text-secondary);
        }

        .auth-title {
            font-size: var(--font-xl);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-8);
            text-align: center;
        }

        .form-group {
            margin-bottom: var(--space-6);
        }

        .form-label {
            display: block;
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .form-input {
            width: 100%;
            padding: var(--space-4) var(--space-5);
            border: 2px solid var(--border-primary);
            border-radius: var(--radius-xl);
            font-size: var(--font-base);
            color: var(--text-primary);
            background: white;
            transition: all var(--transition-base);
            outline: none;
        }

        .form-input:hover {
            border-color: var(--primary-400);
        }

        .form-input:focus {
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-error {
            display: none;
            margin-top: var(--space-2);
            padding: var(--space-3) var(--space-4);
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            border-radius: var(--radius-lg);
            font-size: var(--font-sm);
            color: #dc2626;
        }

        .form-error.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
        }

        .form-checkbox-group {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .form-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-500);
        }

        .form-checkbox-label {
            font-size: var(--font-sm);
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-link {
            font-size: var(--font-sm);
            color: var(--primary-500);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-base);
        }

        .form-link:hover {
            color: var(--primary-600);
        }

        .btn-auth {
            width: 100%;
            padding: var(--space-4) var(--space-6);
            background: var(--primary-gradient);
            border: none;
            border-radius: var(--radius-xl);
            font-size: var(--font-base);
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 8px 20px rgba(103, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-auth::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-auth:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(103, 126, 234, 0.4);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-auth-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-divider {
            text-align: center;
            margin: var(--space-6) 0;
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-primary);
        }

        .auth-divider-text {
            display: inline-block;
            padding: 0 var(--space-4);
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-secondary);
            font-size: var(--font-sm);
            position: relative;
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--space-6);
            font-size: var(--font-sm);
            color: var(--text-secondary);
        }

        .auth-footer-link {
            color: var(--primary-500);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-base);
        }

        .auth-footer-link:hover {
            color: var(--primary-600);
        }

        @media (max-width: 640px) {
            .auth-card {
                padding: var(--space-8);
            }

            .auth-brand-name {
                font-size: var(--font-xl);
            }

            .auth-title {
                font-size: var(--font-lg);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="auth-brand-name">Automatter</div>
                <div class="auth-brand-tagline">Automate your social media</div>
            </div>

            <h1 class="auth-title">Welcome Back</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-error" id="errorMessage"></div>

                <div class="form-footer">
                    <div class="form-checkbox-group">
                        <input type="checkbox" id="remember" class="form-checkbox">
                        <label for="remember" class="form-checkbox-label">Remember me</label>
                    </div>
                    <a href="#" class="form-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth" id="submitBtn">
                    <span class="btn-auth-text">
                        <span id="btnText">Sign In</span>
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/signup" class="auth-footer-link">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Disable button and show loading state
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span><span>Signing in...</span>';
            errorMessage.classList.remove('show');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('authToken', data.access_token);

                    // Show success and redirect
                    btnText.innerHTML = '<span>✓ Success!</span>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    throw new Error(data.detail || 'Login failed');
                }
            } catch (error) {
                errorMessage.textContent = error.message || 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
